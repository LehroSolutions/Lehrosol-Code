name: Bug report
description: Something in Lehrosol Code does not behave as documented.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug.

        **Do not use this form for security vulnerabilities.** Public issues are
        world-readable and permanently archived. Report security problems
        through the private channel described in `SECURITY.md`
        (Security tab → "Report a vulnerability").

        Redact API keys, model paths, and file contents from anything you paste.

  - type: input
    id: app-version
    attributes:
      label: Lehrosol Code version
      description: Settings → About, or the version shown in the app window.
      placeholder: "2.4.0"
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: LehroSol CLI version
      description: Output of `lehrosol --version`, or "not installed".
      placeholder: "3.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Windows 10/11 x64 is supported. Linux bridge tests run in CI; Linux and macOS desktop builds are unsupported.
      options:
        - Windows 11
        - Windows 10
        - Ubuntu / Debian
        - Other Linux
        - macOS (unsupported)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Only relevant if you built from source. `node -v`
      placeholder: "v22.13.0"
    validations:
      required: false

  - type: dropdown
    id: install-source
    attributes:
      label: How are you running it?
      options:
        - Downloaded installer
        - Built from source (`pnpm start`)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Numbered, minimal steps, starting from a freshly launched app.
        1.
        2.
        3.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Output from the Engine log / Output panes, `pnpm test` output, or the
        app's own error text.

        **Redact API keys, file contents, and model paths first.**
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, config, model names and quant types, crash output.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am not reporting a security vulnerability here (those go through `SECURITY.md`).
          required: true
        - label: I have redacted API keys, credentials, and private file contents.
          required: false
