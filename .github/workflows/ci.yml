name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The workflow needs nothing but read access to the repository contents.
permissions:
  contents: read

# Only the newest commit needs to be tested; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target for this app. Linux is kept green so the
        # POSIX branches in electron/bridge.js (which vs where, $SHELL vs
        # powershell.exe) do not silently rot.
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm must be installed BEFORE actions/setup-node so that `cache: pnpm`
      # can resolve `pnpm store path`. The version comes from the
      # `packageManager` field in package.json (pnpm@11.15.1) so this workflow
      # can never drift from what the repo pins.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 22.13 is the real floor, not 22.12: Electron tooling wants
          # >= 22.12.0, but pnpm 11.15.1 refuses to run below Node 22.13
          # ("ERROR: This version of pnpm requires at least Node.js v22.13"),
          # which fails the `cache: pnpm` step before install even starts.
          node-version: "22.13"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit release-tool dependencies
        run: pnpm audit --audit-level high

      - name: Test
        run: pnpm test

      - name: Check syntax, metadata, and docs
        run: pnpm check

      - name: Exercise Electron workflows
        if: runner.os == 'Windows'
        run: pnpm smoke

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm dist

      - name: Exercise packaged application
        if: runner.os == 'Windows'
        run: pnpm smoke --packaged

      - name: Upload desktop QA
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-qa
          path: dist/qa/
          if-no-files-found: warn
