name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Publishing a GitHub Release requires write access to contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    name: build windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # electron-builder resolves the version from package.json and needs the
          # full history to derive a changelog/version string.
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag must match package.json version' }

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22.13 is the real floor, not 22.12: Electron 44 tooling wants
          # >= 22.12.0, but pnpm 11.15.1 refuses to run below Node 22.13
          # ("ERROR: This version of pnpm requires at least Node.js v22.13"),
          # which fails the `cache: pnpm` step before install even starts.
          node-version: "22.13"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # ---------------------------------------------------------------------------
      # CODE SIGNING IS NOT CONFIGURED. The installer produced below is UNSIGNED.
      # Windows SmartScreen will warn on first run, and the binary will not be
      # trusted by anything that checks Authenticode. Do not describe a release as
      # signed until one of these is actually done.
      #
      # Option A — CI signing certificate (recommended, no secrets in the repo):
      #   Add repository secrets:
      #     CSC_LINK         = base64 of the exported .pfx, e.g. base64 -w0 cert.pfx
      #     CSC_KEY_PASSWORD = the password for that .pfx
      #   electron-builder picks both up automatically from the environment. No
      #   code change is needed here; the steps below start working as soon as the
      #   secrets exist.
      #
      # Keep signing keys in repository secrets; never commit a .pfx to git.
      # Checksums below verify downloaded bytes; they do not replace signing.
      # ---------------------------------------------------------------------------

      # --publish=never is set in the `dist` script on purpose. electron-builder
      # 26 auto-publishes whenever it detects a CI environment, which fails with
      # "GitHub Personal Access Token is not set" and is removed in v27. This
      # workflow publishes through softprops/action-gh-release instead, so the
      # build step must only build.
      - name: Build installer
        run: pnpm dist
        env:
          # Set these two secrets on the repository to enable signing. Left
          # deliberately unset/empty so this workflow is honest about the
          # current unsigned state.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: List build output
        run: Get-ChildItem -Path dist -File | Select-Object Name, Length

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter *.exe -File)
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced' }
          foreach ($installer in $installers) {
            $releaseName = $installer.Name -replace '\s+', '.'
            if ($releaseName -ne $installer.Name) {
              $releasePath = Join-Path $installer.DirectoryName $releaseName
              if (Test-Path -LiteralPath $releasePath) { throw 'Installer asset name collision' }
              Rename-Item -LiteralPath $installer.FullName -NewName $releaseName
            }
          }
          $installers = @(Get-ChildItem -Path dist -Filter *.exe -File)
          $checksums = $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Lehrosol Code ${{ github.ref_name }}
          # dist/ holds the NSIS installer, the blockmap, and the auto-update
          # metadata written by electron-builder. Paths are relative to the
          # repository root.
          files: |
            dist/*.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: true
          make_latest: false
          generate_release_notes: true
          body: |
            ## Code signing status

            Installers are unsigned unless signing credentials were configured
            for this build. Check the executable's Authenticode signature before
            describing the release as signed. SHA256SUMS verifies download integrity.

            ## Before publishing this draft

            - Verify the downloaded installer's SHA-256 against SHA256SUMS.
            - Install and launch on Windows 10/11 x64 in a disposable environment.
            - Pair with `npm install -g @lehrosolutions/cli@beta` and verify CLI discovery.
            - Open a project and complete an engine-start and dry-run mission check.
