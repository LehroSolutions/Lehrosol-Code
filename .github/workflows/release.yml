name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional existing candidate run to verify a historical upgrade only
        required: false
        type: string

# Publishing a GitHub Release requires write access to contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    if: ${{ !inputs.candidate_run_id }}
    name: build windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # electron-builder resolves the version from package.json and needs the
          # full history to derive a changelog/version string.
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag must match package.json version' }

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 22.13 is the real floor, not 22.12: Electron tooling wants
          # >= 22.12.0, but pnpm 11.15.1 refuses to run below Node 22.13
          # ("ERROR: This version of pnpm requires at least Node.js v22.13"),
          # which fails the `cache: pnpm` step before install even starts.
          node-version: "22.13"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit release-tool dependencies
        run: pnpm audit --audit-level high

      - name: Test
        run: pnpm test

      - name: Check syntax, metadata, and docs
        run: pnpm check

      - name: Exercise source application
        run: pnpm smoke

      # ---------------------------------------------------------------------------
      # CODE SIGNING IS NOT CONFIGURED. The installer produced below is UNSIGNED.
      # Windows SmartScreen will warn on first run, and the binary will not be
      # trusted by anything that checks Authenticode. Do not describe a release as
      # signed until one of these is actually done.
      #
      # Option A — CI signing certificate (recommended, no secrets in the repo):
      #   Add repository secrets:
      #     CSC_LINK         = base64 of the exported .pfx, e.g. base64 -w0 cert.pfx
      #     CSC_KEY_PASSWORD = the password for that .pfx
      #   electron-builder picks both up automatically from the environment. No
      #   code change is needed here; the steps below start working as soon as the
      #   secrets exist.
      #
      # Keep signing keys in repository secrets; never commit a .pfx to git.
      # Checksums below verify downloaded bytes; they do not replace signing.
      # ---------------------------------------------------------------------------

      # --publish=never is set in the `dist` script on purpose. electron-builder
      # 26 auto-publishes whenever it detects a CI environment, which fails with
      # "GitHub Personal Access Token is not set" and is removed in v27. This
      # workflow publishes through softprops/action-gh-release instead, so the
      # build step must only build.
      - name: Build installer
        run: pnpm dist
        env:
          # Set these two secrets on the repository to enable signing. Left
          # deliberately unset/empty so this workflow is honest about the
          # current unsigned state.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: List build output
        run: Get-ChildItem -Path dist -File | Select-Object Name, Length

      - name: Exercise packaged application
        run: pnpm smoke --packaged

      - name: Verify isolated Windows install and upgrade
        run: pnpm verify:installation

      - name: Verify package contents and prepare release assets
        run: pnpm release:prepare

      - name: Retain release QA diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-qa
          path: |
            dist/qa/
            !dist/qa/installation-old/**
            !dist/qa/installation-new/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/Lehrosol.Code.Setup.*.exe
            dist/SHA256SUMS
            dist/release.json
            dist/RELEASE-NOTES.md
            dist/qa/
            !dist/qa/installation-old/**
            !dist/qa/installation-new/**
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Lehrosol Code ${{ github.ref_name }}
          files: |
            dist/Lehrosol.Code.Setup.*.exe
            dist/SHA256SUMS
            dist/release.json
          fail_on_unmatched_files: true
          draft: true
          make_latest: false
          body_path: dist/RELEASE-NOTES.md

  historical:
    if: ${{ inputs.candidate_run_id }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/historical-upgrade.yml
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
