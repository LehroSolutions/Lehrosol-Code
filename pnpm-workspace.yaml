# pnpm settings (pnpm 11 no longer reads a "pnpm" field in package.json, and it
# reads its settings from this file rather than from .npmrc).
#
# This is NOT a workspace: there is no `packages:` list, so pnpm treats the
# repo root as a single package. The file is named pnpm-workspace.yaml only
# because that is where pnpm 11 expects its settings to live.

# electron-builder cannot follow pnpm's default symlinked node_modules when
# packaging, so we need a flat npm-style tree. Previously this lived in .npmrc,
# where pnpm 11 silently ignored it — the setting had to move here.
nodeLinker: hoisted

overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  '@xmldom/xmldom@>=0.9.0-beta.1 <0.9.12': 0.9.12
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'minimatch@>=7.0.0 <11.0.1': 11.0.1

allowBuilds:
  # Electron's postinstall downloads the prebuilt binary. Required — without it
  # a fresh install has no runtime and `pnpm start` fails.
  electron: true
  # electron-builder pulls this in for the Squirrel.Windows target. We only
  # build NSIS, so its build script is never needed.
  electron-winstaller: false
